name: Release

# Pull requests opened with the built-in token start no workflows, so the release PR would never get its
# required checks. Give the caller's RELEASE_PLEASE_TOKEN (a token that may write contents and pull
# requests) as "token". Without it the built-in token is used and the checks must be started by hand.

# Only develop may be promoted to main, so a repo that follows that rule runs this on develop and
# passes "target-branch: develop": the release PR then goes into develop and the tag is made there.

on:
  workflow_call:
    inputs:
      target-branch:
        description: Branch the release PR is opened against. Empty means the default branch.
        type: string
        required: false
        default: ''
    secrets:
      token:
        description: Token release-please uses to open the release PR, so that the PR runs its checks.
        required: false
    outputs:
      release_created:
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        value: ${{ jobs.release-please.outputs.tag_name }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.token || github.token }}
          target-branch: ${{ inputs.target-branch }}
