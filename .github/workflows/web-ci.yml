name: Web CI

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: .

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ inputs.working-directory }}/.nvmrc
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run lint, check, and test in parallel
        run: |
          # Run read-only checks concurrently with separate logs so output does not interleave.
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          pnpm lint >"$tmp/lint.log" 2>&1 &
          p_lint=$!
          pnpm check >"$tmp/check.log" 2>&1 &
          p_check=$!
          pnpm test >"$tmp/test.log" 2>&1 &
          p_test=$!
          rc=0
          wait "$p_lint" || rc=$?
          cat "$tmp/lint.log"
          wait "$p_check" || rc=$?
          cat "$tmp/check.log"
          wait "$p_test" || rc=$?
          cat "$tmp/test.log"
          exit "$rc"
      - run: pnpm build
