name: Release assets

# Adds files built earlier in the same workflow run to a GitHub release, together with a
# SHA256SUMS.txt and a signed build provenance attestation for every file. Download links use the
# stable file names, so https://github.com/<owner>/<repo>/releases/latest/download/<name> never
# changes. Upload the files with actions/upload-artifact first and pass that artifact's name here.

on:
  workflow_call:
    inputs:
      tag_name:
        description: Release tag such as v1.2.3.
        required: true
        type: string
      artifact_name:
        description: Name of the artifact (from actions/upload-artifact) that holds the files.
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: assets
      - name: Write checksums
        working-directory: assets
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%P\n' | sort > ../files.txt
          test -s ../files.txt
          xargs -a ../files.txt sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v3
        with:
          subject-checksums: assets/SHA256SUMS.txt
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag_name }}
        run: gh release upload "$TAG" assets/* --clobber --repo "$GITHUB_REPOSITORY"
