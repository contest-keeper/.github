[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/contest-keeper/REPO"
rust-version = "1.87"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Fast edit-test loop: our crates keep line tables for backtraces only,
# dependencies are optimised once and carry no debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# `unsafe_code = "forbid"` cannot be lowered inside a crate. A crate that really needs `unsafe`
# (Windows or disk FFI) skips `[lints] workspace = true`, repeats the lints it wants and sets
# `unsafe_code = "deny"` with a `// SAFETY:` comment at each use. Say so in its README.
#
# In each crate's Cargo.toml:
#
# [package]
# name = "ck-something"
# version = "0.1.0"
# edition.workspace = true
# license.workspace = true
# repository.workspace = true
# rust-version.workspace = true
#
# [lints]
# workspace = true
