name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: e.g. 0.3.1, or the image name
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove passwords, tokens and personal data first.
      render: text
